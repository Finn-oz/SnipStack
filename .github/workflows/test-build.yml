name: Test Build

# 手动触发的测试构建:只产出 NSIS 安装包工件,不发 Release、不需要任何 secrets。
# 用法:GitHub 仓库页 → Actions → Test Build → Run workflow,完成后在运行页下载 artifact。
"on":
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 (test)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri icons
        run: pnpm build:icon
        env:
          PLATFORM: windows-latest

      - name: Fetch OCR models
        run: pnpm fetch:ocr-models

      # VC++ 运行库 app-local 部署:SnipStack.exe 导入 msvcp140*.dll(ONNX Runtime 的
      # C++ 静态库按 /MD 编译,crt-static 管不到),全新 Windows 没有 VC++ Redistributable。
      # 从 runner 自带的 VS 2022 Redist 目录取 VC143 CRT DLL 打进 bundle resources,
      # 安装钩子(src-tauri/nsis/hooks.nsh)再拷到安装根目录。缺失时 tauri build 会因
      # resources glob 无匹配而失败,不会悄悄发出缺运行库的包。
      - name: Stage VC++ runtime DLLs
        shell: pwsh
        run: |
          # 不硬编码 VS 版本/工具集(runner 镜像会升级:2022/VC143 → 18/VC145…),
          # 用 vswhere 定位安装目录,再通配 Microsoft.VC*.CRT 取最新。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $roots = @()
          if (Test-Path $vswhere) {
            $roots += & $vswhere -latest -products * -property installationPath
          }
          $roots += "${env:ProgramFiles}\Microsoft Visual Studio\*\*"
          $crt = $roots | Where-Object { $_ } | ForEach-Object {
            Get-ChildItem "$_\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue
          } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) {
            Write-Host "::warning::VC redist directory not found under Visual Studio; listing for diagnosis"
            Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -ErrorAction SilentlyContinue | ForEach-Object { "  VS root: $($_.FullName)" }
            # 兜底:系统级安装的 VC++ 运行库同样是官方 redist 文件。
            $sys = "$env:SystemRoot\System32"
            if (Test-Path "$sys\msvcp140.dll") {
              New-Item -ItemType Directory -Force -Path src-tauri/resources/vcredist | Out-Null
              Copy-Item "$sys\msvcp140*.dll","$sys\vcruntime140*.dll","$sys\concrt140.dll","$sys\vccorlib140.dll" src-tauri/resources/vcredist/ -ErrorAction SilentlyContinue
              Write-Host "::warning::staged VC++ runtime DLLs from System32 fallback"
            } else {
              throw "no VC++ runtime DLLs available on runner"
            }
          } else {
            Write-Host "VC redist dir: $($crt.FullName)"
          }
          if ($crt) {
            New-Item -ItemType Directory -Force -Path src-tauri/resources/vcredist | Out-Null
            Copy-Item "$($crt.FullName)\*.dll" src-tauri/resources/vcredist/
          }
          Get-ChildItem src-tauri/resources/vcredist | ForEach-Object { "$($_.Name) $($_.Length)" }
          foreach ($required in 'msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll') {
            if (-not (Test-Path "src-tauri/resources/vcredist/$required")) { throw "missing $required" }
          }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build NSIS installer
        run: pnpm tauri build --target x86_64-pc-windows-msvc
        env:
          CI: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: snipstack-windows-x64-setup
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
