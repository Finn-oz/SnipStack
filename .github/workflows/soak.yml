name: Soak Test

# Windows 长时浸泡测试:构建 → 静默安装 → 持续模拟剪贴板负载 + 周期重启 explorer,
# 采样 GDI/USER/句柄曲线并断言(详见 scripts/soak-monitor.ps1)。
# 背景:排查「运行一段时间后托盘图标消失、二次启动无响应」。公开仓库的
# GitHub 托管 runner 不计费,手动触发,可指定时长;需要常态化时再加 schedule。
"on":
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "浸泡时长(分钟)"
        default: "120"
      explorer_restart_minutes:
        description: "explorer 重启间隔(分钟,0 关闭)"
        default: "15"

jobs:
  soak-windows:
    name: Soak Windows x64
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri icons
        run: pnpm build:icon
        env:
          PLATFORM: windows-latest

      - name: Fetch OCR models
        run: pnpm fetch:ocr-models

      # VC++ 运行库 app-local 部署:SnipStack.exe 导入 msvcp140*.dll(ONNX Runtime 的
      # C++ 静态库按 /MD 编译,crt-static 管不到),全新 Windows 没有 VC++ Redistributable。
      # 从 runner 自带的 VS 2022 Redist 目录取 VC143 CRT DLL 打进 bundle resources,
      # 安装钩子(src-tauri/nsis/hooks.nsh)再拷到安装根目录。缺失时 tauri build 会因
      # resources glob 无匹配而失败,不会悄悄发出缺运行库的包。
      - name: Stage VC++ runtime DLLs
        shell: pwsh
        run: |
          # 不硬编码 VS 版本/工具集(runner 镜像会升级:2022/VC143 → 18/VC145…),
          # 用 vswhere 定位安装目录,再通配 Microsoft.VC*.CRT 取最新。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $roots = @()
          if (Test-Path $vswhere) {
            $roots += & $vswhere -latest -products * -property installationPath
          }
          $roots += "${env:ProgramFiles}\Microsoft Visual Studio\*\*"
          $crt = $roots | Where-Object { $_ } | ForEach-Object {
            Get-ChildItem "$_\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue
          } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) {
            Write-Host "::warning::VC redist directory not found under Visual Studio; listing for diagnosis"
            Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -ErrorAction SilentlyContinue | ForEach-Object { "  VS root: $($_.FullName)" }
            # 兜底:系统级安装的 VC++ 运行库同样是官方 redist 文件。
            $sys = "$env:SystemRoot\System32"
            if (Test-Path "$sys\msvcp140.dll") {
              New-Item -ItemType Directory -Force -Path src-tauri/resources/vcredist | Out-Null
              Copy-Item "$sys\msvcp140*.dll","$sys\vcruntime140*.dll","$sys\concrt140.dll","$sys\vccorlib140.dll" src-tauri/resources/vcredist/ -ErrorAction SilentlyContinue
              Write-Host "::warning::staged VC++ runtime DLLs from System32 fallback"
            } else {
              throw "no VC++ runtime DLLs available on runner"
            }
          } else {
            Write-Host "VC redist dir: $($crt.FullName)"
          }
          if ($crt) {
            New-Item -ItemType Directory -Force -Path src-tauri/resources/vcredist | Out-Null
            Copy-Item "$($crt.FullName)\*.dll" src-tauri/resources/vcredist/
          }
          Get-ChildItem src-tauri/resources/vcredist | ForEach-Object { "$($_.Name) $($_.Length)" }
          foreach ($required in 'msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll') {
            if (-not (Test-Path "src-tauri/resources/vcredist/$required")) { throw "missing $required" }
          }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build NSIS installer
        run: pnpm tauri build --target x86_64-pc-windows-msvc
        env:
          CI: false

      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "installer not found" }
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/S"
          Start-Sleep -Seconds 5

      - name: Locate installed exe
        id: locate
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\SnipStack",
            "$env:LOCALAPPDATA\Programs\SnipStack",
            "$env:ProgramFiles\SnipStack"
          )
          $exe = $candidates |
            Where-Object { Test-Path $_ } |
            ForEach-Object { Get-ChildItem $_ -Recurse -Filter SnipStack.exe -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $exe) { throw "installed SnipStack.exe not found in: $($candidates -join '; ')" }
          # 安装钩子应已把 VC++ 运行库 DLL 拷到 exe 同目录(runner 自带系统级运行库,
          # 缺了也能跑,所以必须显式断言文件存在,否则打包缺陷在 CI 上是隐形的)。
          foreach ($dll in 'msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll') {
            if (-not (Test-Path (Join-Path $exe.DirectoryName $dll))) { throw "$dll not deployed next to SnipStack.exe" }
          }
          "VC++ runtime DLLs present next to exe"
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Run soak monitor
        shell: pwsh
        run: |
          pwsh -File scripts/soak-monitor.ps1 `
            -ExePath "${{ steps.locate.outputs.exe }}" `
            -DurationMinutes ([int]"${{ github.event.inputs.duration_minutes || '120' }}") `
            -ExplorerRestartEveryMinutes ([int]"${{ github.event.inputs.explorer_restart_minutes || '15' }}") `
            -CsvPath soak-samples.csv

      # upload-artifact 算不出跨盘(D:\ 工作区 vs C:\ 用户目录)的公共根,先拷进工作区。
      - name: Collect app logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path soak-logs | Out-Null
          $logDir = "$env:LOCALAPPDATA\com.snipstack.app\logs"
          if (Test-Path $logDir) {
            Copy-Item "$logDir\*" soak-logs -Recurse -Force
          }

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-results
          path: |
            soak-samples.csv
            soak-logs/
          if-no-files-found: warn
          retention-days: 14
