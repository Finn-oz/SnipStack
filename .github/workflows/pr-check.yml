name: PR Check

"on":
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        shell: bash
        run: |
          frontend=false
          backend=false

          case "${{ github.event_name }}" in
            pull_request)
              base_sha="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              base_sha="${{ github.event.before }}"
              ;;
            *)
              base_sha=""
              ;;
          esac

          # 首次推送/force-push 时 before 为全零 SHA 或指向已不可达的提交
          if [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha=""
          fi
          if [ -n "$base_sha" ] && ! git rev-parse --quiet --verify "$base_sha^{commit}" > /dev/null; then
            base_sha=""
          fi

          if [ -z "$base_sha" ]; then
            # 拿不到可靠基准(workflow_dispatch、首次推送、force-push)时视为全变更
            frontend=true
            backend=true
          else
            while IFS= read -r file; do
              case "$file" in
                src/*|public/*|scripts/*)
                  frontend=true
                  ;;
              esac

              case "$file" in
                */*) ;;
                *.cjs|*.html|*.json|*.jsonc|*.ts|*.mts|*.cts|pnpm-lock.yaml|pnpm-workspace.yaml)
                  frontend=true
                  ;;
              esac

              case "$file" in
                src-tauri/*|rust-toolchain.toml|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.release-it.ts|scripts/buildIcon.ts)
                  backend=true
                  ;;
              esac
            done < <(git diff --name-only "$base_sha" HEAD)
          fi

          {
            echo "frontend=$frontend"
            echo "backend=$backend"
          } >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm lint

      - name: TypeScript
        run: pnpm tsc

  backend:
    name: Rust Check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri icons
        run: pnpm build:icon
        env:
          PLATFORM: ${{ matrix.os }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 统一从仓库根目录跑 cargo(与 tauri-action 发布构建、pnpm tauri dev、
      # lint-staged 钩子一致):src-tauri/.cargo/config.toml 的 crt-static 只在
      # cwd 位于 src-tauri 内时被 cargo 发现,而它与 ort 的 /MD 预编译静态库
      # 冲突,会让 Windows 链接失败。
      - name: Rust fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features
