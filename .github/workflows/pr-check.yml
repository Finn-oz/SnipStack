name: PR Check

"on":
  workflow_dispatch:

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        shell: bash
        run: |
          frontend=false
          backend=false
          base_sha="${{ github.event.pull_request.base.sha }}"

          # 手动触发没有 PR base 可比对:空 base 会让 git diff 报错、两个开关
          # 都停在 false,前后端检查被静默跳过。此时一律全跑。
          if [[ -z "$base_sha" ]]; then
            {
              echo "frontend=true"
              echo "backend=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r file; do
            case "$file" in
              src/*|public/*|scripts/*)
                frontend=true
                ;;
            esac

            case "$file" in
              */*) ;;
              *.cjs|*.html|*.json|*.jsonc|*.ts|*.mts|*.cts|pnpm-lock.yaml|pnpm-workspace.yaml)
                frontend=true
                ;;
            esac

            case "$file" in
              src-tauri/*|rust-toolchain.toml|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.release-it.ts|scripts/buildIcon.ts)
                backend=true
                ;;
            esac
          done < <(git diff --name-only "$base_sha" HEAD)

          {
            echo "frontend=$frontend"
            echo "backend=$backend"
          } >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm lint

      - name: TypeScript
        run: pnpm tsc

  backend:
    name: Rust Check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri icons
        run: pnpm build:icon
        env:
          PLATFORM: ${{ matrix.os }}

      # tauri-build 会校验 bundle.resources 的 glob,而 resources/vcredist/*.dll 不入库
      # (发版与浸泡流程从 VS Redist 目录拷入)。这里只编译和测试、不出安装包,
      # 取 runner 系统目录里的运行库让 glob 有匹配即可。
      - name: Stage VC++ runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/vcredist | Out-Null
          Copy-Item "$env:SystemRoot\System32\msvcp140*.dll","$env:SystemRoot\System32\vcruntime140*.dll" src-tauri/resources/vcredist/
          if (-not (Get-ChildItem src-tauri/resources/vcredist/*.dll)) { throw "no VC++ runtime DLLs on runner" }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust test
        if: runner.os != 'Windows'
        working-directory: src-tauri
        run: cargo test --all-targets --all-features

      # ONNX Runtime 的静态库按 /MD 编译,debug 测试产物在 crt-static(/MT)下链接不过
      # (LNK2001 __imp_*)。测试只验证逻辑,改用动态 CRT 链接;环境变量 RUSTFLAGS
      # 会整体取代 .cargo/config.toml 里的 target rustflags。
      - name: Rust test (Windows, dynamic CRT)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --all-targets --all-features
        env:
          RUSTFLAGS: -C target-feature=-crt-static
